name: Syntax Check

on:
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile tracker modules
        run: python -m py_compile main.py run_current.py progression_goals.py boss_progression.py
      - name: Run tracker tests
        run: python -m unittest discover -s tests -v
